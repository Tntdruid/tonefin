<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: http: https:; media-src http: https: blob:; style-src 'self'; script-src 'self'">
  <title>Tonefin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar"><img src="../../assets/icon.png" alt=""><span id="tb-title" class="tb-title">Tonefin</span></header>
  <section id="login" class="login hidden">
    <form id="login-form" class="login-box">
      <img src="../../assets/icon.png" alt="" class="login-logo">
      <h1>Tonefin</h1>
      <p class="muted small tagline" data-i18n="login.tagline"></p>
      <label><span data-i18n="login.server"></span><input id="login-server" placeholder="http://10.10.1.33:8096" autocomplete="url" required></label>
      <label class="pw"><span data-i18n="login.user"></span><input id="login-user" autocomplete="username" required></label>
      <label class="pw"><span data-i18n="login.pass"></span><input id="login-pass" type="password" autocomplete="current-password"></label>
      <button type="submit" id="login-btn" class="primary" data-i18n="login.btn"></button>
      <div class="or muted small" data-i18n="login.or"></div>
      <button type="button" id="quick-btn" data-i18n="login.quick"></button>
      <div id="quick-box" class="quick hidden">
        <div class="muted small" data-i18n="quick.label"></div>
        <div id="quick-code" class="quick-code"></div>
        <p class="muted small" data-i18n-html="quick.help"></p>
        <button type="button" id="quick-cancel" class="link muted" data-i18n="quick.cancel"></button>
      </div>
      <p id="login-error" class="error"></p>
      <p class="muted small" data-i18n="login.note"></p>
    </form>
  </section>

  <section id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><img src="../../assets/icon.png" alt=""><span>Tonefin</span></div>
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off">
      <nav>
        <button data-nav="home" data-i18n="nav.home"></button>
        <button data-nav="albums" data-i18n="nav.albums"></button>
        <button data-nav="artists" data-i18n="nav.artists"></button>
        <button data-nav="songs" data-i18n="nav.songs"></button>
        <button data-nav="playlists" data-i18n="nav.playlists"></button>
        <button data-nav="favorites" data-i18n="nav.favorites"></button>
        <button data-nav="nowplaying" data-i18n="nav.nowplaying"></button>
      </nav>
      <div class="side-title muted small" data-i18n="side.playlists"></div>
      <div id="side-playlists" class="side-playlists"></div>
      <div class="sidebar-foot">
        <button id="update-banner" class="update hidden"></button>
        <div id="report-status" class="report-status" title=""></div>
        <div class="muted small" id="user-line"></div>
        <button id="logout" class="link" data-i18n="logout"></button>
        <button data-nav="settings" class="link" data-i18n="nav.settings"></button>
        <button id="open-log" class="link" data-i18n="showLog"></button>
      </div>
    </aside>
    <main id="content" class="content"></main>
    <footer class="bar">
      <div class="bar-track" id="bar-track">
        <img id="bar-cover" class="hidden" alt="">
        <div class="bar-text">
          <div id="bar-title" class="title"></div>
          <div id="bar-artist" class="muted"></div>
        </div>
        <button id="bar-fav" class="icon heart hidden">♡</button>
      </div>
      <div class="bar-center">
        <div class="controls">
          <button id="btn-shuffle" class="icon" data-i18n-title="bar.shuffle">⇄</button>
          <button id="btn-prev" class="icon" data-i18n-title="bar.prev">⏮</button>
          <button id="btn-play" class="icon big" data-i18n-title="bar.play">▶</button>
          <button id="btn-next" class="icon" data-i18n-title="bar.next">⏭</button>
          <button id="btn-repeat" class="icon">↻</button>
          <button id="btn-queue" class="icon" data-i18n-title="bar.queue">☰</button>
        </div>
        <div class="seek">
          <span id="time-pos">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0">
          <span id="time-dur">0:00</span>
        </div>
      </div>
      <div class="bar-right">
        <span>🔊</span><input id="volume" type="range" min="0" max="100" value="80">
      </div>
    </footer>
  </section>
  <div id="toast" class="toast hidden"></div>

  <script src="i18n.js"></script>
  <script src="keys.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
